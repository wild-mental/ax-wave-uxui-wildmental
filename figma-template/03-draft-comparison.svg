<g id="워크시트 이름"><text x="60.0" y="78.0" style="font-family:'Noto Sans KR';font-size:34px;font-weight:700;fill:#0f3b2e">Google Stitch로 만든 테마별 화면 시안 비교표</text><text x="60.0" y="116.0" style="font-family:'Noto Sans KR';font-size:17px;font-weight:400;fill:#7a8580">교재 3.5절 · 시안 이미지는 시안 화면 칸에 붙여 넣습니다 · 세 기준은 ○ / △ / × + 이유 한 줄</text><rect x="60" y="136" width="2180" height="4" rx="2" fill="#0f3b2e" stroke="none" stroke-width="0"/></g>
