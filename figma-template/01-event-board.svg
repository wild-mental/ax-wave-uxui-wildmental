<g id="카드 구분 안내"><text x="2520.0" y="1037.2" style="font-family:'Noto Sans KR';font-size:16px;font-weight:400;fill:#7a8580">사건 = 가로로 긴 직사각형 · 대상 객체 = 정사각형(굵은 테두리)</text><text x="2520.0" y="1067.2" style="font-family:'Noto Sans KR';font-size:16px;font-weight:400;fill:#7a8580">질문 = 점선 테두리 + 모서리 "?" · 색 없이도 모양과 라벨로 구분됩니다</text></g>
