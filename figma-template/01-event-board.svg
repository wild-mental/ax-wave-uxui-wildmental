<g id="여정 레인"><rect x="60" y="190" width="190" height="520" rx="0" fill="#0f3b2e" stroke="none" stroke-width="0"/><text x="131.0" y="459.0" style="font-family:'Noto Sans KR';font-size:24px;font-weight:700;fill:#ffffff">여정</text><text x="260.0" y="740.0" style="font-family:'Noto Sans KR';font-size:16px;font-weight:400;fill:#7a8580">단계는 4~6개를 시간순으로 씁니다. 남는 상자는 지웁니다. 감정 숫자는 단계 사이를 실선으로 잇습니다.</text></g>
<g id="사건 레인"><rect x="60" y="766" width="190" height="250" rx="0" fill="#0f3b2e" stroke="none" stroke-width="0"/><text x="131.0" y="900.0" style="font-family:'Noto Sans KR';font-size:24px;font-weight:700;fill:#ffffff">사건</text><rect x="260" y="776" width="2160" height="230" rx="6" fill="#ffffff" stroke="#c4ccc8" stroke-width="2" stroke-dasharray="10 8"/><text x="284.0" y="812.0" style="font-family:'Noto Sans KR';font-size:17px;font-weight:400;fill:#7a8580">사건 카드를 여정 단계 아래에 시간순으로 붙입니다. 과거형으로 씁니다. 예) "세트가 기록됨"</text></g>
<g id="대상 객체 레인"><rect x="60" y="1032" width="190" height="230" rx="0" fill="#0f3b2e" stroke="none" stroke-width="0"/><text x="100.3" y="1156.0" style="font-family:'Noto Sans KR';font-size:24px;font-weight:700;fill:#ffffff">대상 객체</text><rect x="260" y="1042" width="2160" height="210" rx="6" fill="#ffffff" stroke="#c4ccc8" stroke-width="2" stroke-dasharray="10 8"/><text x="284.0" y="1078.0" style="font-family:'Noto Sans KR';font-size:17px;font-weight:400;fill:#7a8580">사건 속 명사를 대상 객체 카드로 붙입니다. 같은 대상 객체는 한 장만 둡니다.</text></g>
<g id="질문 레인"><rect x="60" y="1278" width="190" height="190" rx="0" fill="#0f3b2e" stroke="none" stroke-width="0"/><text x="131.0" y="1382.0" style="font-family:'Noto Sans KR';font-size:24px;font-weight:700;fill:#ffffff">질문</text><rect x="260" y="1288" width="2160" height="170" rx="6" fill="#ffffff" stroke="#c4ccc8" stroke-width="2" stroke-dasharray="10 8"/><text x="284.0" y="1324.0" style="font-family:'Noto Sans KR';font-size:17px;font-weight:400;fill:#7a8580">지금 답할 수 없는 것을 질문 카드로 남깁니다.</text></g>
<g id="완료 기준 체크리스트"><rect x="2480" y="190" width="860" height="267.24999999999994" rx="0" fill="#ffffff" stroke="#c4ccc8" stroke-width="2"/><rect x="2480" y="190" width="860" height="10" rx="0" fill="#0f3b2e" stroke="none" stroke-width="0"/><text x="2504.0" y="238.0" style="font-family:'Noto Sans KR';font-size:20px;font-weight:700;fill:#0f3b2e">완료 기준 체크리스트</text><rect x="2504" y="262" width="17" height="17" rx="3" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/><text x="2536.0" y="278.0" style="font-family:'Noto Sans KR';font-size:17px;font-weight:400;fill:#1c1c1e">여정 단계를 4~6개 적고 단계마다 근거 날짜를 붙였다</text><rect x="2504" y="298.65" width="17" height="17" rx="3" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/><text x="2536.0" y="314.6" style="font-family:'Noto Sans KR';font-size:17px;font-weight:400;fill:#1c1c1e">사건을 과거형으로 10개 이상 시간순으로 붙였다</text><rect x="2504" y="335.29999999999995" width="17" height="17" rx="3" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/><text x="2536.0" y="351.3" style="font-family:'Noto Sans KR';font-size:17px;font-weight:400;fill:#1c1c1e">사건마다 등장하는 대상 객체를 대상 객체 레인에 붙였다</text><rect x="2504" y="371.94999999999993" width="17" height="17" rx="3" fill="#ffffff" stroke="#1c1c1e" stroke-width="1.5"/><text x="2536.0" y="387.9" style="font-family:'Noto Sans KR';font-size:17px;font-weight:400;fill:#1c1c1e">대상 객체 레인의 카드를 문서 템플릿의 대상 객체 카드로 모두 옮겼다 (한 행으로, 또는 다른</text><text x="2536.0" y="412.6" style="font-family:'Noto Sans KR';font-size:17px;font-weight:400;fill:#1c1c1e">행의 속성으로)</text></g>
<g id="복사용 카드 영역"><rect x="2480" y="487.24999999999994" width="860" height="1032.75" rx="0" fill="#eaf3ee" stroke="#c4ccc8" stroke-width="2"/><text x="2504.0" y="533.2" style="font-family:'Noto Sans KR';font-size:22px;font-weight:700;fill:#0f3b2e">복사해서 쓰는 카드</text><text x="2504.0" y="565.2" style="font-family:'Noto Sans KR';font-size:15px;font-weight:400;fill:#7a8580">Mac Option, Windows Alt를 누른 채 끌면 복사됩니다. 종류 라벨은 지우지 않습니다.</text></g>
